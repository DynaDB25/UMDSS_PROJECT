<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ScholarCircle — Unified Scholarship Management and Decision Support System for Ghanaian students." />
    <meta name="theme-color" content="#FAF8F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>ScholarCircle · Scholarship Management & Decision Support</title>
    <script>
      // Resolve the theme before first paint so a dark-mode user never sees a
      // flash of paper. Mirrors the storage key used by ThemeProvider.
      (function () {
        try {
          var stored = localStorage.getItem('scholarcircle-theme') || 'light'
          var resolved =
            stored === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : stored
          document.documentElement.classList.add(resolved)
          document.documentElement.style.backgroundColor =
            resolved === 'dark' ? '#0B0B0C' : '#FAF8F3'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
